services:
  fitness-bot:
    build: .
    restart: unless-stopped   # comes back up after a crash or a server reboot
    env_file: .env            # secrets and settings - see .env.example
    volumes:
      - ./data:/data          # token_health.json, token_calendar.json, bot state, short workout history
      - ./configs:/app/configs:ro   # the short workout library - edit without rebuilding
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
